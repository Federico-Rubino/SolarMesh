<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motor Cleaning</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="clean.css">
</head>
<body>
  <header class="bar">
    <h1>🧽 Motor cleaning</h1>
    <span id="status" class="status offline">offline</span>
    <span class="env" id="state">idle</span>
    <a class="env" href="index.html" id="back">← Dashboard</a>
  </header>

  <main class="clean">
    <section class="card controls">
      <h2>Panel</h2>
      <div id="panels" class="choice"></div>

      <h2>Duration</h2>
      <div class="freq">
        <input type="number" id="seconds" min="1" max="60" step="1" value="5"> s</div>
      <div class="choice" id="presets">
        <button data-s="3">3 s</button>
        <button data-s="5">5 s</button>
        <button data-s="10">10 s</button>
      </div>

      <div class="actions">
        <button id="vibrate" class="primary">▶ Start motor</button>
        <button id="stop">■ Stop</button>
      </div>
      <p id="message" class="hint"></p>
    </section>

    <section class="card">
      <div class="card-head"><h2 id="chart-title">Panel voltage</h2><span class="hint">last 2 minutes · shaded = motor running</span></div>
      <div class="now"><b id="volts">–</b> V</div>
      <svg id="chart" class="chart"></svg>
      <div class="result" id="result">Run a cleaning to compare the voltage before and after.</div>
    </section>
  </main>

  <script src="libs/socket.io.min.js"></script>
  <script src="libs/arduino.js"></script>
  <script src="clean.js"></script>
</body>
</html>
